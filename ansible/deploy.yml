- name: Install Docker and deploy Prosche
  hosts: localhost
  connection: local
  become: yes

  tasks:

    - name: Check Docker installation
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Update apt
      apt:
        update_cache: yes
      when: docker_check.rc != 0

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
      when: docker_check.rc != 0

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run Docker Compose
      command: docker compose up -d --build
      args:
        chdir: "{{ playbook_dir }}/.."

